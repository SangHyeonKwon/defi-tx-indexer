name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치의 이전 실행은 취소 — 단 main 푸시는 전부 완주시킨다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, unit + PG integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # docker-compose.yml의 postgres 서비스와 동일한 계정/DB
        image: postgres:16-alpine
        env:
          POSTGRES_USER: defi
          POSTGRES_PASSWORD: defi
          POSTGRES_DB: defi_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U defi -d defi_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://defi:defi@localhost:5432/defi_analytics
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # fmt는 빌드 산출물이 필요 없으므로 캐시 복원보다 먼저 — 실패가 공짜
      - name: rustfmt
        run: cargo fmt --check

      - uses: Swatinem/rust-cache@v2
        with:
          # -D warnings 아래에선 빨간 런이 정상 상태 — 실패해도 캐시는 저장
          cache-on-failure: true

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      # 마이그레이션은 프로덕션/테스트와 동일한 sqlx `migrate!` 경로로 적용해
      # `_sqlx_migrations` 레저를 남긴다 — psql로 돌리면 레저가 비어 이후
      # `db::run_migrations`(통합 테스트)가 전체를 재적용하고, 비-멱등
      # 마이그레이션이 들어오는 순간 CI에서만 터진다. Unit tests 스텝의 빌드
      # 캐시를 재사용하므로 sqlx-cli 설치보다도 빠르다.
      - name: Apply migrations (sqlx ledger)
        run: cargo run -p db --example migrate

      # 시드 순서의 단일 출처는 scripts/seed.sh — compose seed 서비스와 공유.
      - name: Apply views/procedures/triggers + seed
        run: scripts/seed.sh "$DATABASE_URL"

      # db(쿼리 계층) + api(admin 인증 성공 경로 등 HTTP 계층)의 #[ignore]
      # 테스트를 모두 실행 — decoder/indexer는 ignored 테스트가 없어 no-op.
      # --tests: doctest 제외(Unit tests 스텝에서 이미 실행). `-- --ignored`는
      # ```ignore doc 블록까지 컴파일하려 들기 때문에 명시적으로 막는다.
      - name: Integration tests (db + api, requires PG + seed)
        run: cargo test --workspace --tests -- --ignored

  web:
    name: Web — tests + build (build includes tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build
