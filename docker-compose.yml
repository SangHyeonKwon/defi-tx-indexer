services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: defi
      POSTGRES_PASSWORD: defi
      POSTGRES_DB: defi_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defi -d defi_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── REST API Server ────────────────────────────────────────────
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://defi:defi@postgres:5432/defi_analytics
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      MAX_DB_CONNECTIONS: "10"
      RUST_LOG: api=info,db=info
      # S16/M006/D023 — required, no silent default (ApiConfig::from_env will fail).
      # ${VAR:?msg} forces an error at compose start rather than a delayed runtime crash.
      AMARILLO_ADMIN_API_KEY: ${AMARILLO_ADMIN_API_KEY:?required (S16/M006)}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Web Dashboard (static SPA via nginx) ──────────────────────
  web:
    build:
      context: ./web
      args:
        # Baked into the bundle at build time. The dashboard runs in the
        # browser, so this must be the host-reachable API URL, not "api".
        VITE_API_BASE_URL: http://localhost:3000
        # Optional subpath deploy support; "/" for root.
        VITE_APP_BASE_PATH: /
    ports:
      - "8080:80"
    depends_on:
      - api

  # ── Seed (demo data, run manually) ────────────────────────────
  # 적용 파일·순서의 단일 출처는 scripts/seed.sh — CI와 공유한다.
  # seed.sh가 $0 기준 ../sql 을 찾으므로 scripts/와 sql/을 같은 부모로 마운트.
  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./sql:/repo/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /repo/scripts/seed.sh
      - postgres://defi:defi@postgres:5432/defi_analytics

volumes:
  pgdata:
