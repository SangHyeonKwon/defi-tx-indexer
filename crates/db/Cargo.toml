[package]
name = "db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLx-based database layer for DeFi Analytics (Uniswap V3)"

[dependencies]
sqlx.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bigdecimal.workspace = true
chrono.workspace = true
tokio.workspace = true

# S11.1 — DecodedFunction.args가 decoder::abi::DecodedArg를 호스팅.
decoder = { path = "../decoder" }

[dev-dependencies]
# Integration tests live in their own crate and do not inherit the normal
# deps above, so the runtime + time types must be declared here too.
tokio = { workspace = true }
chrono = { workspace = true }
bigdecimal = { workspace = true }
# examples/migrate.rs — CI 마이그레이션 러너의 에러 컨텍스트용.
anyhow = { workspace = true }
